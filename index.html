<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controlito</title>
<style>
:root{--green:#0aa66a;--green2:#087f53;--bg:#f4f7f6;--text:#17302a;--muted:#6d7d78;--card:#fff;--line:#e2ebe7;--danger:#e95b67}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:84px}.top{padding:22px 18px 8px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:white;font-size:23px}.brand h1{font-size:21px;margin:0}.brand small{color:var(--muted)}.screen{padding:10px 16px}.hero{background:linear-gradient(135deg,var(--green),#08b477);color:#fff;border-radius:20px;padding:22px;margin:8px 0 14px;box-shadow:0 8px 22px #0aa66a22}.hero small{opacity:.85}.hero .amount{font-size:34px;font-weight:800;margin:5px 0}.hero b{font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}.stat{display:flex;gap:10px;align-items:center}.ico{width:34px;height:34px;border-radius:10px;background:#e8f8f1;display:grid;place-items:center}.stat strong{display:block;font-size:15px}.stat small{color:var(--muted)}.primary{width:100%;border:0;border-radius:13px;background:var(--green);color:#fff;padding:14px;font-weight:800;margin:14px 0}.secondary{width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:12px;font-weight:700;color:var(--text)}.menu{display:grid;gap:9px}.menu button{border:1px solid var(--line);background:white;border-radius:13px;padding:14px;text-align:left;display:flex;justify-content:space-between;align-items:center;color:var(--text)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:var(--muted);font-size:10.5px;padding:6px 2px}.nav button.active{color:var(--green);font-weight:800}.nav span{display:block;font-size:19px;margin-bottom:2px}.title{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}.title h2{margin:0;font-size:22px}.back{border:0;background:none;font-size:24px;color:var(--text)}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff}.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;text-align:left;color:var(--text)}.product .emoji{font-size:38px}.product strong{display:block;margin-top:5px}.product small{color:var(--muted)}.product .price{font-weight:800;margin-top:6px}.list{display:grid;gap:9px}.sale{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.saleTop{display:flex;justify-content:space-between;gap:10px;font-weight:800}.sale small{color:var(--muted)}.form{display:grid;gap:10px}.form label{font-size:13px;font-weight:700}.form input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin-top:4px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 5px;text-align:center;color:var(--text)}.pay.selected{border:2px solid var(--green);background:#eaf9f3;color:var(--green);font-weight:800}.cartrow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:8px;margin-top:8px}.qty button{border:1px solid var(--line);background:#f7faf8;border-radius:8px;min-width:30px;height:30px;font-weight:800;color:var(--text)}.qty .remove{font-size:12px;padding:0 8px;color:var(--danger);background:white}.cashlabel{display:block;font-size:13px;font-weight:700;margin-top:14px}.cashlabel .search{display:block;margin:7px 0 10px}.changebox{display:flex;justify-content:space-between;align-items:center;background:#eaf9f3;border-radius:11px;padding:13px;margin:8px 0}.changebox strong{font-size:18px;color:var(--green)}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:900;padding:15px 0}.success{text-align:center;padding:55px 10px}.check{width:76px;height:76px;background:#dff7ed;color:var(--green);border-radius:50%;display:grid;place-items:center;font-size:42px;margin:0 auto 18px}.success h2{margin:0}.success .big{font-size:30px;font-weight:900;margin:10px}.hidden{display:none!important}.plus{border:0;background:var(--green);color:#fff;border-radius:10px;width:38px;height:38px;font-size:24px}.danger{color:var(--danger)}

/* Nuevos estilos */
.product:disabled{opacity:.45;cursor:not-allowed}
.prow{display:flex;gap:12px;align-items:center}
.pemoji{font-size:30px}
.prow small{display:block;color:var(--muted);margin-top:2px}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.saleBottom{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.linkbtn{border:0;background:none;color:var(--danger);font-weight:700;font-size:13px;padding:4px 0}
.sale.voided{opacity:.6}
.sale.voided .saleTop span:last-child{text-decoration:line-through}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 6px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:700;color:var(--text)}
.dangerbtn{width:100%;border:1px solid #f2c6ca;background:#fff7f8;color:var(--danger);border-radius:13px;padding:12px;font-weight:700}
.filebtn{display:block;text-align:center;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.ok{color:var(--green)}
.muted{color:var(--muted)}
.notice{border-color:#f3dfa6;background:#fffbef;margin-bottom:12px}
.notice small{display:block;color:var(--muted);margin-top:4px}
.stack{display:grid;gap:9px}
h3.section{font-size:16px;margin:20px 0 10px}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY='controlito_mvp_v1';
const seed={business:'Mi negocio',products:[
{id:1,name:'Imperial',price:1200,cost:700,stock:48,emoji:'🍺'},
{id:2,name:'Coca-Cola',price:1000,cost:550,stock:23,emoji:'🥤'},
{id:3,name:'Chicharrón',price:2500,cost:1300,stock:12,emoji:'🍗'},
{id:4,name:'Hamburguesa',price:3000,cost:1600,stock:15,emoji:'🍔'},
{id:5,name:'Agua',price:600,cost:300,stock:30,emoji:'💧'},
{id:6,name:'Papas',price:1500,cost:700,stock:20,emoji:'🍟'}],sales:[]};
const PAY_ICON={Efectivo:'💵',Tarjeta:'💳',SINPE:'📱'};

/* ---------- Datos ---------- */
function normalize(d){
  d=d&&typeof d==='object'?d:{};
  d.business=typeof d.business==='string'&&d.business.trim()?d.business:'Mi negocio';
  d.products=Array.isArray(d.products)?d.products:[];
  d.sales=Array.isArray(d.sales)?d.sales:[];
  d.closings=Array.isArray(d.closings)?d.closings:[];
  d.settings=Object.assign({lowStock:5,lastBackup:null},d.settings||{});
  return d;
}
function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){d=null}
  return normalize(d||JSON.parse(JSON.stringify(seed)));
}
let data=load();
let state={page:'home',cart:[],payment:'Efectivo',received:'',query:'',success:null,productId:null,histDate:null,opening:'',counted:''};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('No se pudo guardar. Revisá el espacio disponible del navegador.')}}

/* ---------- Utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('es-CR',{style:'currency',currency:'CRC',maximumFractionDigits:0}).format(n)}
function pad(n){return String(n).padStart(2,'0')}
function dayKey(d){const x=new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())}
function todayKey(){return dayKey(new Date())}
function longDate(key){const t=new Date(key+'T12:00:00').toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)}
function time(iso){return new Date(iso).toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'})}
function salesOn(key){return data.sales.filter(s=>!s.voided&&dayKey(s.date)===key)}
function todaySales(){return salesOn(todayKey())}
function totalToday(){return todaySales().reduce((a,s)=>a+s.total,0)}
function sumPay(ss,p){return ss.filter(s=>s.payment===p).reduce((a,s)=>a+s.total,0)}
function grossToday(){return todaySales().reduce((sum,s)=>sum+s.items.reduce((x,i)=>x+(i.price-i.cost)*i.qty,0),0)}
function cartTotal(){return state.cart.reduce((a,i)=>a+i.price*i.qty,0)}
function iconFor(p){return p.emoji||'📦'}
function firstGrapheme(str){
  if(!str)return '';
  if(window.Intl&&Intl.Segmenter){const it=new Intl.Segmenter('es',{granularity:'grapheme'}).segment(str)[Symbol.iterator]().next();return it.done?'':it.value.segment}
  return Array.from(str)[0]||'';
}
function download(name,content,type){
  const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- Navegación ---------- */
function go(page){
  state.page=page;state.query='';state.success=null;
  if(page==='history')state.histDate=todayKey();
  if(page==='closing'){const c=data.closings.find(x=>x.key===todayKey());state.opening=c?String(c.opening):'';state.counted=c?String(c.counted):''}
  render();window.scrollTo(0,0);
}
function render(){document.getElementById('app').innerHTML=header()+`<main class="screen">${page()}</main>`+nav()}
function header(){return `<div class="top"><div class="brand"><div class="logo">▰</div><div><h1>Controlito</h1><small>${esc(data.business)}</small></div></div></div>`}
function page(){
  const pages={home,sell,products,history,summary,add:addProduct,edit:editProduct,restock:restockProduct,closing,settings,success};
  return (pages[state.page]||home)();
}
function nav(){return `<nav class="nav">${[['home','⌂','Inicio'],['sell','🛒','Ventas'],['products','▣','Productos'],['history','☰','Historial'],['settings','⚙︎','Ajustes']].map(([p,i,t])=>`<button class="${state.page===p?'active':''}" data-page="${p}"><span>${i}</span>${t}</button>`).join('')}</nav>`}

/* ---------- Pantallas ---------- */
function home(){
  const ts=todaySales();
  const last=data.settings.lastBackup?new Date(data.settings.lastBackup).getTime():0;
  const needBackup=data.sales.length>0&&Date.now()-last>7*864e5;
  return `<section>
  <div class="hero"><small>Ventas de hoy</small><div class="amount">${money(totalToday())}</div><b>↑ ${ts.length} venta${ts.length===1?'':'s'}</b></div>
  <div class="stats">
    <div class="stat"><div class="ico">💵</div><div><strong>${money(sumPay(ts,'Efectivo'))}</strong><small>Efectivo</small></div></div>
    <div class="stat"><div class="ico">💳</div><div><strong>${money(sumPay(ts,'Tarjeta'))}</strong><small>Tarjeta</small></div></div>
    <div class="stat"><div class="ico">📱</div><div><strong>${money(sumPay(ts,'SINPE'))}</strong><small>SINPE</small></div></div>
    <div class="stat"><div class="ico">📈</div><div><strong>${money(grossToday())}</strong><small>Ganancia est.</small></div></div>
  </div>
  <button class="primary" data-page="sell">🛒 Nueva venta</button>
  ${needBackup?`<div class="card notice">💾 <b>Descargá un respaldo de tus datos</b><small>Los datos viven solo en este dispositivo. Si se borra el navegador, se pierden.</small><button class="secondary" data-export-json style="margin-top:10px">Descargar respaldo</button></div>`:''}
  <div class="menu">
    <button data-page="products">📦 <b>Productos</b><span>›</span></button>
    <button data-page="history">📊 <b>Historial</b><span>›</span></button>
    <button data-page="summary">📋 <b>Resumen del día</b><span>›</span></button>
    <button data-page="closing">🔒 <b>Cierre de caja</b><span>›</span></button>
  </div></section>`;
}

function sell(){
  if(state.success)return success();
  if(!data.products.length)return `<div class="title"><h2>Nueva venta</h2></div><div class="empty">Todavía no hay productos para vender.<button class="primary" data-page="add">+ Agregar producto</button></div>`;
  const q=state.query.toLowerCase();
  const filtered=data.products.filter(p=>p.name.toLowerCase().includes(q));
  const total=cartTotal(),rec=state.received,enough=rec!==''&&Number(rec)>=total;
  return `<div class="title"><h2>Nueva venta</h2></div>
  <input class="search" id="search" placeholder="🔎 Buscar producto..." value="${esc(state.query)}" autocomplete="off">
  <div class="products">${filtered.map(p=>`<button class="product" data-add="${p.id}" ${p.stock<=0?'disabled':''}><div class="emoji">${esc(iconFor(p))}</div><strong>${esc(p.name)}</strong><small>${p.stock<=0?'Agotado':'Stock: '+p.stock}</small><div class="price">${money(p.price)}</div></button>`).join('')}</div>
  ${filtered.length?'':'<div class="empty">No hay productos con ese nombre.</div>'}
  ${state.cart.length?`<div class="card" style="margin-top:14px"><b>Productos seleccionados</b>
    ${state.cart.map(i=>`<div class="cartrow"><div><b>${esc(i.name)}</b><small style="display:block;color:var(--muted)">${money(i.price)} c/u</small><div class="qty"><button data-qty="${i.id}" data-delta="-1" aria-label="Quitar uno">−</button><span>${i.qty}</span><button data-qty="${i.id}" data-delta="1" aria-label="Agregar uno">+</button><button class="remove" data-remove="${i.id}">Quitar</button></div></div><b>${money(i.price*i.qty)}</b></div>`).join('')}
    <div class="total"><span>Total</span><span>${money(total)}</span></div>
    <div class="paygrid">${['Efectivo','Tarjeta','SINPE'].map(p=>`<button class="pay ${state.payment===p?'selected':''}" data-pay="${p}">${PAY_ICON[p]}<br>${p}</button>`).join('')}</div>
    ${state.payment==='Efectivo'?`<label class="cashlabel">¿Cuánto recibió el negocio?<input class="search" id="received" type="number" min="0" inputmode="numeric" placeholder="Ej. 5000" value="${esc(rec)}"></label>
      <div class="quick"><button data-cash="exact">Exacto</button>${[1000,2000,5000,10000,20000].map(v=>`<button data-cash="${v}">${money(v)}</button>`).join('')}</div>
      <div class="changebox"><span>Vuelto</span><strong id="changeVal">${money(enough?Number(rec)-total:0)}</strong></div>
      <small id="cashWarn" class="danger ${rec!==''&&!enough?'':'hidden'}">El monto recibido no alcanza para cubrir la venta.</small>`:''}
    <button class="primary" data-checkout>Registrar venta</button></div>`:''}`;
}

function products(){
  const lim=data.settings.lowStock;
  const low=data.products.filter(p=>p.stock<=lim);
  const q=state.query.toLowerCase();
  const filtered=data.products.filter(p=>p.name.toLowerCase().includes(q));
  return `<div class="title"><h2>Productos</h2><button class="plus" data-page="add" aria-label="Agregar producto">+</button></div>
  ${low.length?`<div class="card" style="margin-bottom:12px;border-color:#f2c6ca;background:#fff7f8"><b class="danger">⚠️ ${low.length} producto${low.length===1?'':'s'} con stock bajo</b><small style="display:block;margin-top:4px;color:var(--muted)">${low.map(p=>esc(p.name)+' ('+p.stock+')').join(', ')}</small></div>`:''}
  ${data.products.length?`<input class="search" id="productSearch" placeholder="🔎 Buscar producto..." value="${esc(state.query)}" autocomplete="off">`:''}
  <div class="list">${filtered.map(p=>`<div class="card"><div class="prow"><span class="pemoji">${esc(iconFor(p))}</span><div><b>${esc(p.name)}</b><small>Precio ${money(p.price)} · Costo ${money(p.cost)}</small><small>Stock: <b class="${p.stock<=lim?'danger':''}">${p.stock}</b></small></div></div><div class="twobtn"><button class="secondary" data-edit="${p.id}">✏️ Editar</button><button class="secondary" data-restock="${p.id}">📦 Reponer</button></div></div>`).join('')}
  ${!data.products.length?'<div class="empty">Todavía no hay productos. Tocá + para agregar el primero.</div>':!filtered.length?'<div class="empty">No hay productos con ese nombre.</div>':''}</div>`;
}

function productFields(p){
  const val=v=>v==null?'':esc(v);
  return `<label>Nombre<input id="fname" value="${val(p.name)}" placeholder="Ej. Casado con pollo"></label>
  <label>Precio de venta<input id="fprice" type="number" min="0" inputmode="numeric" value="${val(p.price)}" placeholder="2500"></label>
  <label>Costo<input id="fcost" type="number" min="0" inputmode="numeric" value="${val(p.cost)}" placeholder="1400"></label>
  <label>Cantidad en stock<input id="fstock" type="number" min="0" inputmode="numeric" value="${val(p.stock)}" placeholder="20"></label>
  <label>Emoji (opcional)<input id="femoji" value="${val(p.emoji)}" placeholder="📦"></label>`;
}
function readProductForm(){
  const v=id=>document.getElementById(id).value.trim();
  const name=v('fname'),price=Number(v('fprice')),cost=v('fcost')===''?0:Number(v('fcost')),stock=v('fstock')===''?0:Number(v('fstock')),emoji=firstGrapheme(v('femoji'))||'📦';
  if(!name){alert('Escribí el nombre del producto.');return null}
  if(!(price>0)){alert('El precio de venta debe ser mayor a 0.');return null}
  if(!(cost>=0)){alert('El costo debe ser 0 o más.');return null}
  if(!Number.isInteger(stock)||stock<0){alert('El stock debe ser un número entero, 0 o más.');return null}
  return {name,price,cost,stock,emoji};
}
function addProduct(){return `<div class="title"><button class="back" data-page="products" aria-label="Volver">‹</button><h2>Nuevo producto</h2><span></span></div><div class="card form">${productFields({})}<button class="primary" data-save-product>Guardar producto</button></div>`}
function editProduct(){
  const p=data.products.find(x=>x.id===state.productId);if(!p){state.page='products';return products()}
  return `<div class="title"><button class="back" data-page="products" aria-label="Volver">‹</button><h2>Editar producto</h2><span></span></div>
  <div class="card form"><div style="font-size:42px">${esc(iconFor(p))}</div>${productFields(p)}
  <small class="muted">Cambiá el stock aquí solo para corregir conteos o mermas. Para mercadería nueva usá "Reponer".</small>
  <button class="primary" data-update-product>Guardar cambios</button>
  <button class="dangerbtn" data-delete-product>🗑️ Eliminar producto</button></div>`;
}
function restockProduct(){
  const p=data.products.find(x=>x.id===state.productId);if(!p){state.page='products';return products()}
  return `<div class="title"><button class="back" data-page="products" aria-label="Volver">‹</button><h2>Reponer stock</h2><span></span></div><div class="card"><div style="font-size:42px">${esc(iconFor(p))}</div><h2 style="margin:6px 0">${esc(p.name)}</h2><p style="color:var(--muted)">Stock actual: <b>${p.stock}</b></p><div class="form"><label>Cantidad a agregar<input id="rstock" type="number" min="1" inputmode="numeric" placeholder="Ej. 20"></label><button class="primary" data-restock-product>📦 Agregar al inventario</button></div></div>`;
}

function history(){
  const key=state.histDate||todayKey();
  const day=data.sales.filter(s=>dayKey(s.date)===key).reverse();
  const valid=day.filter(s=>!s.voided),voided=day.length-valid.length;
  return `<div class="title"><h2>Historial</h2></div>
  <input class="search" type="date" id="histDate" value="${key}" max="${todayKey()}" aria-label="Elegir día">
  <div class="hero"><small>${esc(longDate(key))}</small><div class="amount">${money(valid.reduce((a,s)=>a+s.total,0))}</div><b>${valid.length} venta${valid.length===1?'':'s'}${voided?` · ${voided} anulada${voided===1?'':'s'}`:''}</b></div>
  <div class="list">${day.length?day.map(s=>`<div class="sale ${s.voided?'voided':''}"><div class="saleTop"><span>${time(s.date)} · ${s.items.map(i=>esc(i.name)+' x'+i.qty).join(', ')}</span><span>${money(s.total)}</span></div><div class="saleBottom"><small>${PAY_ICON[s.payment]||''} ${esc(s.payment)}${s.voided?' · <b class="danger">Anulada</b>':''}</small>${s.voided?'':`<button class="linkbtn" data-void="${s.id}">Anular</button>`}</div></div>`).join(''):'<div class="empty">No hay ventas registradas este día.</div>'}</div>`;
}

function summary(){
  const ts=todaySales(),total=totalToday(),cost=ts.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.cost*i.qty,0),0);
  const top={};ts.forEach(s=>s.items.forEach(i=>{top[i.name]=(top[i.name]||0)+i.qty}));
  const topList=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="title"><button class="back" data-page="home" aria-label="Volver">‹</button><h2>Resumen del día</h2><span></span></div>
  <div class="card list">
    <div class="stat"><div class="ico">💰</div><div><strong>${money(total)}</strong><small>Ventas</small></div></div>
    <div class="stat"><div class="ico">💵</div><div><strong>${money(sumPay(ts,'Efectivo'))}</strong><small>Efectivo</small></div></div>
    <div class="stat"><div class="ico">💳</div><div><strong>${money(sumPay(ts,'Tarjeta'))}</strong><small>Tarjeta</small></div></div>
    <div class="stat"><div class="ico">📱</div><div><strong>${money(sumPay(ts,'SINPE'))}</strong><small>SINPE</small></div></div>
    <div class="stat"><div class="ico">🧾</div><div><strong>${ts.length}</strong><small>Ventas realizadas</small></div></div>
  </div>
  <div class="card" style="margin-top:12px"><small>Costo de productos</small><h2>${money(cost)}</h2><small>Ganancia estimada</small><h2 style="color:var(--green)">${money(total-cost)}</h2></div>
  ${topList.length?`<h3 class="section">Más vendidos hoy</h3><div class="card">${topList.map(([n,q])=>`<div class="row"><span>${esc(n)}</span><b>${q}</b></div>`).join('')}</div>`:''}
  <button class="primary" data-page="closing">🔒 Hacer cierre de caja</button>`;
}

/* ---------- Cierre de caja ---------- */
function closingCalc(){
  const ts=todaySales(),cash=sumPay(ts,'Efectivo'),opening=Number(state.opening)||0,expected=opening+cash;
  const counted=state.counted===''?null:Number(state.counted),diff=counted===null?null:counted-expected;
  return {ts,cash,opening,expected,counted,diff};
}
function diffInfo(diff){
  if(diff===null)return ['Ingresá el efectivo contado para ver la diferencia.','muted'];
  if(diff===0)return ['La caja cuadra ✅','ok'];
  return diff>0?[`Sobran ${money(diff)} en caja.`,'ok']:[`Faltan ${money(-diff)} en caja.`,'danger'];
}
function closing(){
  const c=closingCalc(),[msg,cls]=diffInfo(c.diff),prev=data.closings.find(x=>x.key===todayKey());
  const past=data.closings.filter(x=>x.key!==todayKey()).sort((a,b)=>b.key.localeCompare(a.key)).slice(0,10);
  return `<div class="title"><button class="back" data-page="home" aria-label="Volver">‹</button><h2>Cierre de caja</h2><span></span></div>
  <div class="card"><small class="muted">${esc(longDate(todayKey()))}</small>
    <div class="row"><span>💵 Ventas en efectivo</span><b>${money(c.cash)}</b></div>
    <div class="row"><span>💳 Tarjeta</span><b>${money(sumPay(c.ts,'Tarjeta'))}</b></div>
    <div class="row"><span>📱 SINPE</span><b>${money(sumPay(c.ts,'SINPE'))}</b></div>
  </div>
  <div class="card form" style="margin-top:12px">
    <label>Monto inicial en caja (apertura)<input id="opening" type="number" min="0" inputmode="numeric" placeholder="Ej. 20000" value="${esc(state.opening)}"></label>
    <div class="changebox"><span>Efectivo esperado</span><strong id="expVal">${money(c.expected)}</strong></div>
    <label>Efectivo contado al cerrar<input id="counted" type="number" min="0" inputmode="numeric" placeholder="Contá el efectivo de la caja" value="${esc(state.counted)}"></label>
    <div class="row"><span>Diferencia</span><b id="diffVal" class="${cls}">${c.diff===null?'—':money(c.diff)}</b></div>
    <small id="diffMsg" class="${cls}">${msg}</small>
    <button class="primary" data-save-closing>${prev?'Actualizar cierre de hoy':'Guardar cierre'}</button>
    ${prev?`<small class="muted">Cierre de hoy guardado a las ${time(prev.date)}.</small>`:''}
  </div>
  ${past.length?`<h3 class="section">Cierres anteriores</h3><div class="list">${past.map(x=>{const [m,k]=diffInfo(x.diff);return `<div class="sale"><div class="saleTop"><span>${esc(longDate(x.key))}</span></div><small>Esperado ${money(x.expected)} · Contado ${money(x.counted)}</small><div class="${k}" style="font-size:13px;font-weight:700;margin-top:4px">${m}</div></div>`}).join('')}</div>`:''}`;
}
function updateClosing(){
  const c=closingCalc(),[msg,cls]=diffInfo(c.diff);
  document.getElementById('expVal').textContent=money(c.expected);
  const dv=document.getElementById('diffVal');dv.textContent=c.diff===null?'—':money(c.diff);dv.className=cls;
  const dm=document.getElementById('diffMsg');dm.textContent=msg;dm.className=cls;
}
function saveClosing(){
  const c=closingCalc();
  if(c.counted===null||!(c.counted>=0))return alert('Ingresá el efectivo contado al cerrar.');
  const rec={id:Date.now(),key:todayKey(),date:new Date().toISOString(),opening:c.opening,cash:c.cash,card:sumPay(c.ts,'Tarjeta'),sinpe:sumPay(c.ts,'SINPE'),total:totalToday(),count:c.ts.length,expected:c.expected,counted:c.counted,diff:c.diff};
  data.closings=data.closings.filter(x=>x.key!==rec.key);data.closings.push(rec);save();
  alert('Cierre de caja guardado ✅');render();
}

/* ---------- Ajustes y respaldo ---------- */
function settings(){
  const lb=data.settings.lastBackup;
  return `<div class="title"><h2>Ajustes</h2></div>
  <div class="card form">
    <label>Nombre del negocio<input id="sbiz" value="${esc(data.business)}" placeholder="Ej. Pulpería La Esquina"></label>
    <label>Avisar stock bajo cuando queden<input id="slow" type="number" min="0" inputmode="numeric" value="${data.settings.lowStock}"></label>
    <button class="primary" data-save-settings style="margin:4px 0 0">Guardar ajustes</button>
  </div>
  <h3 class="section">Respaldo de datos</h3>
  <div class="card stack">
    <small class="muted">Los datos se guardan solo en este dispositivo. Descargá un respaldo seguido para no perder nada.${lb?` Último respaldo: ${esc(new Date(lb).toLocaleDateString('es-CR'))}.`:' Todavía no hay respaldos.'}</small>
    <button class="secondary" data-export-json>⬇️ Descargar respaldo</button>
    <label class="secondary filebtn">⬆️ Restaurar respaldo<input type="file" id="importFile" accept=".json,application/json" hidden></label>
    <button class="secondary" data-export-csv>📄 Exportar ventas para Excel</button>
  </div>
  <h3 class="section">Zona de cuidado</h3>
  <button class="dangerbtn" data-reset>🗑️ Borrar todos los datos</button>`;
}
function exportJSON(){
  download(`controlito-respaldo-${todayKey()}.json`,JSON.stringify(data,null,2),'application/json');
  data.settings.lastBackup=new Date().toISOString();save();render();
}
function exportCSV(){
  if(!data.sales.length)return alert('Todavía no hay ventas para exportar.');
  const cell=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=[['Fecha','Hora','Productos','Total','Método de pago','Estado']];
  data.sales.forEach(s=>rows.push([dayKey(s.date),time(s.date),s.items.map(i=>i.name+' x'+i.qty).join(' | '),s.total,s.payment,s.voided?'Anulada':'Válida']));
  download(`controlito-ventas-${todayKey()}.csv`,'\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');
}
function importBackup(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result);
      if(!parsed||!Array.isArray(parsed.products)||!Array.isArray(parsed.sales))throw new Error('formato');
      if(!confirm('Esto reemplaza todos los datos actuales por los del respaldo. ¿Continuar?'))return;
      data=normalize(parsed);save();state.cart=[];state.received='';
      alert('Respaldo restaurado ✅');go('home');
    }catch(e){alert('Ese archivo no es un respaldo válido de Controlito.')}
  };
  r.readAsText(file);
}
function saveSettings(){
  const name=document.getElementById('sbiz').value.trim()||'Mi negocio';
  const low=Number(document.getElementById('slow').value);
  if(!Number.isInteger(low)||low<0)return alert('El aviso de stock bajo debe ser un número entero, 0 o más.');
  data.business=name;data.settings.lowStock=low;save();alert('Ajustes guardados ✅');render();
}
function resetAll(){
  if(!confirm('¿Borrar TODOS los productos, ventas y cierres? Esto no se puede deshacer.'))return;
  if(!confirm('Última confirmación: ¿descargaste un respaldo? Tocá Aceptar para borrar todo.'))return;
  data=normalize({});save();state.cart=[];state.received='';go('home');
}

/* ---------- Acciones de venta ---------- */
function success(){
  const s=state.success;
  return `<div class="success"><div class="check">✓</div><h2>¡Venta registrada!</h2><div class="big">${money(s.total)}</div><p>${PAY_ICON[s.payment]} ${s.payment}</p>${s.payment==='Efectivo'?`<p>Recibido: <b>${money(s.received)}</b><br>Vuelto: <b>${money(s.change)}</b></p>`:''}<button class="primary" data-page="sell">🛒 Nueva venta</button><button class="secondary" data-page="home">Volver al inicio</button></div>`;
}
function addToCart(id){
  const p=data.products.find(x=>x.id===id);
  if(!p||p.stock<=0)return alert('Este producto no tiene existencias.');
  const item=state.cart.find(x=>x.id===id);
  if(item){if(item.qty>=p.stock)return alert('No hay más stock disponible.');item.qty++}
  else state.cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});
  render();
}
function changeQty(id,delta){
  const item=state.cart.find(x=>x.id===id),product=data.products.find(x=>x.id===id);if(!item)return;
  if(delta>0&&product&&item.qty>=product.stock)return alert('No hay más stock disponible.');
  item.qty+=delta;if(item.qty<=0)state.cart=state.cart.filter(x=>x.id!==id);
  state.received='';render();
}
function removeFromCart(id){state.cart=state.cart.filter(x=>x.id!==id);state.received='';render()}
function updateChange(){
  const total=cartTotal(),rec=state.received,enough=rec!==''&&Number(rec)>=total;
  const box=document.getElementById('changeVal');if(box)box.textContent=money(enough?Number(rec)-total:0);
  const warn=document.getElementById('cashWarn');if(warn)warn.classList.toggle('hidden',!(rec!==''&&!enough));
}
function checkoutSale(){
  if(!state.cart.length)return;
  const total=cartTotal();
  if(state.payment==='Efectivo'&&(state.received===''||Number(state.received)<total))return alert('Ingresá un monto recibido igual o mayor al total.');
  for(const i of state.cart){
    const p=data.products.find(x=>x.id===i.id);
    if(!p)return alert(`"${i.name}" ya no existe. Quitalo de la venta.`);
    if(p.stock<i.qty)return alert(`No hay suficiente stock de ${p.name} (quedan ${p.stock}).`);
  }
  const received=state.payment==='Efectivo'?Number(state.received):0,change=state.payment==='Efectivo'?received-total:0;
  data.sales.push({id:Date.now(),date:new Date().toISOString(),total,payment:state.payment,received,change,items:state.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost}))});
  state.cart.forEach(i=>{data.products.find(x=>x.id===i.id).stock-=i.qty});
  save();state.success={total,payment:state.payment,received,change};state.cart=[];state.received='';render();window.scrollTo(0,0);
}
function voidSale(id){
  const s=data.sales.find(x=>x.id===id);if(!s||s.voided)return;
  if(!confirm(`¿Anular la venta de ${money(s.total)} de las ${time(s.date)}? Los productos vuelven al inventario.`))return;
  s.voided=true;s.voidedAt=new Date().toISOString();
  s.items.forEach(i=>{const p=data.products.find(x=>x.id===i.id);if(p)p.stock+=i.qty});
  save();render();
}

/* ---------- Acciones de productos ---------- */
function saveProduct(){const f=readProductForm();if(!f)return;data.products.push({id:Date.now(),...f});save();go('products')}
function updateProduct(){
  const p=data.products.find(x=>x.id===state.productId);if(!p)return;
  const f=readProductForm();if(!f)return;
  Object.assign(p,f);
  const c=state.cart.find(x=>x.id===p.id);if(c){c.name=p.name;c.price=p.price;c.cost=p.cost}
  save();state.productId=null;go('products');
}
function deleteProduct(){
  const p=data.products.find(x=>x.id===state.productId);if(!p)return;
  if(!confirm(`¿Eliminar "${p.name}"? Las ventas pasadas se mantienen en el historial.`))return;
  data.products=data.products.filter(x=>x.id!==p.id);state.cart=state.cart.filter(x=>x.id!==p.id);
  save();state.productId=null;go('products');
}
function restockProductSave(){
  const p=data.products.find(x=>x.id===state.productId),qty=Number(document.getElementById('rstock').value);
  if(!p||!Number.isInteger(qty)||qty<1)return alert('Ingresá una cantidad válida para reponer.');
  p.stock+=qty;save();state.productId=null;go('products');
}

/* ---------- Eventos (delegados) ---------- */
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.page)return go(d.page);
  if(d.add)return addToCart(+d.add);
  if(d.pay){state.payment=d.pay;return render()}
  if(d.qty)return changeQty(+d.qty,+d.delta);
  if(d.remove)return removeFromCart(+d.remove);
  if(d.cash){state.received=d.cash==='exact'?String(cartTotal()):d.cash;return render()}
  if(d.edit){state.productId=+d.edit;return go('edit')}
  if(d.restock){state.productId=+d.restock;return go('restock')}
  if(d.void)return voidSale(+d.void);
  if('checkout' in d)return checkoutSale();
  if('saveProduct' in d)return saveProduct();
  if('updateProduct' in d)return updateProduct();
  if('deleteProduct' in d)return deleteProduct();
  if('restockProduct' in d)return restockProductSave();
  if('saveClosing' in d)return saveClosing();
  if('saveSettings' in d)return saveSettings();
  if('exportJson' in d)return exportJSON();
  if('exportCsv' in d)return exportCSV();
  if('reset' in d)return resetAll();
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='search'||t.id==='productSearch'){
    const pos=t.selectionStart;state.query=t.value;render();
    const n=document.getElementById(t.id);if(n){n.focus();n.setSelectionRange(pos,pos)}
  }else if(t.id==='received'){state.received=t.value;updateChange()}
  else if(t.id==='opening'||t.id==='counted'){state[t.id]=t.value;updateClosing()}
});
app.addEventListener('change',e=>{
  if(e.target.id==='histDate'){state.histDate=e.target.value||todayKey();render()}
  if(e.target.id==='importFile'){importBackup(e.target.files[0]);e.target.value=''}
});
render();
</script>
</body></html>
