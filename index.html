<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controlito MVP</title>
<style>
:root{--green:#0aa66a;--green2:#087f53;--bg:#f4f7f6;--text:#17302a;--muted:#6d7d78;--card:#fff;--line:#e2ebe7;--danger:#e95b67}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:76px}.top{padding:22px 18px 8px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:white;font-size:23px}.brand h1{font-size:21px;margin:0}.brand small{color:var(--muted)}.screen{padding:10px 16px}.hero{background:linear-gradient(135deg,var(--green),#08b477);color:#fff;border-radius:20px;padding:22px;margin:8px 0 14px;box-shadow:0 8px 22px #0aa66a22}.hero small{opacity:.85}.hero .amount{font-size:34px;font-weight:800;margin:5px 0}.hero b{font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}.stat{display:flex;gap:10px;align-items:center}.ico{width:34px;height:34px;border-radius:10px;background:#e8f8f1;display:grid;place-items:center}.stat strong{display:block;font-size:15px}.stat small{color:var(--muted)}.primary{width:100%;border:0;border-radius:13px;background:var(--green);color:#fff;padding:14px;font-weight:800;margin:14px 0}.secondary{width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:12px;font-weight:700}.menu{display:grid;gap:9px}.menu button,.rowbtn{border:1px solid var(--line);background:white;border-radius:13px;padding:14px;text-align:left;display:flex;justify-content:space-between;align-items:center;color:var(--text)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:6px}.nav button.active{color:var(--green);font-weight:800}.nav span{display:block;font-size:19px;margin-bottom:2px}.title{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}.title h2{margin:0;font-size:22px}.back{border:0;background:none;font-size:24px}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff}.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;text-align:left}.product .emoji{font-size:38px}.product strong{display:block;margin-top:5px}.product small{color:var(--muted)}.product .price{font-weight:800;margin-top:6px}.list{display:grid;gap:9px}.sale{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.saleTop{display:flex;justify-content:space-between;font-weight:800}.sale small{color:var(--muted)}.form{display:grid;gap:10px}.form label{font-size:13px;font-weight:700}.form input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 5px;text-align:center}.pay.selected{border:2px solid var(--green);background:#eaf9f3;color:var(--green);font-weight:800}.cartrow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:900;padding:15px 0}.success{text-align:center;padding:55px 10px}.check{width:76px;height:76px;background:#dff7ed;color:var(--green);border-radius:50%;display:grid;place-items:center;font-size:42px;margin:0 auto 18px}.success h2{margin:0}.success .big{font-size:30px;font-weight:900;margin:10px}.hidden{display:none!important}.plus{border:0;background:var(--green);color:#fff;border-radius:10px;width:38px;height:38px;font-size:24px}.danger{color:var(--danger)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY='controlito_mvp_v1';
const seed={business:'Mi negocio',products:[
{id:1,name:'Imperial',price:1200,cost:700,stock:48,emoji:'🍺'},
{id:2,name:'Coca-Cola',price:1000,cost:550,stock:23,emoji:'🥤'},
{id:3,name:'Chicharrón',price:2500,cost:1300,stock:12,emoji:'🍗'},
{id:4,name:'Hamburguesa',price:3000,cost:1600,stock:15,emoji:'🍔'},
{id:5,name:'Agua',price:600,cost:300,stock:30,emoji:'💧'},
{id:6,name:'Papas',price:1500,cost:700,stock:20,emoji:'🍟'}],sales:[]};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
let state={page:'home',cart:[],payment:'Efectivo',query:'',success:null};
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function money(n){return new Intl.NumberFormat('es-CR',{style:'currency',currency:'CRC',maximumFractionDigits:0}).format(n)}
function todaySales(){let d=new Date().toDateString();return data.sales.filter(s=>new Date(s.date).toDateString()===d)}
function totalToday(){return todaySales().reduce((a,s)=>a+s.total,0)}
function iconFor(p){return p.emoji||'📦'}
function render(){const app=document.getElementById('app');app.innerHTML=header()+`<main class="screen">${page()}</main>${nav()};bind()}`
function header(){return `<div class="top"><div class="brand"><div class="logo">▰</div><div><h1>Controlito</h1><small>${data.business}</small></div></div></div>`}
function page(){if(state.page==='home')return home();if(state.page==='sell')return sell();if(state.page==='products')return products();if(state.page==='history')return history();if(state.page==='summary')return summary();if(state.page==='add')return addProduct();if(state.page==='success')return success();return home()}
function home(){let ts=todaySales(), cash=ts.filter(s=>s.payment==='Efectivo').reduce((a,s)=>a+s.total,0),card=ts.filter(s=>s.payment==='Tarjeta').reduce((a,s)=>a+s.total,0),sinpe=ts.filter(s=>s.payment==='SINPE').reduce((a,s)=>a+s.total,0);return `<section><div class="hero"><small>VENTAS DE HOY</small><div class="amount">${money(totalToday())}</div><b>↑ ${ts.length} ventas</b></div><div class="stats"><div class="stat"><div class="ico">💵</div><div><strong>${money(cash)}</strong><small>Efectivo</small></div></div><div class="stat"><div class="ico">💳</div><div><strong>${money(card)}</strong><small>Tarjeta</small></div></div><div class="stat"><div class="ico">📱</div><div><strong>${money(sinpe)}</strong><small>SINPE</small></div></div><div class="stat"><div class="ico">📈</div><div><strong>${money(grossToday())}</strong><small>Ganancia est.</small></div></div></div><button class="primary" data-page="sell">🛒 Nueva venta</button><div class="menu"><button data-page="products">📦 <b>Productos</b><span>›</span></button><button data-page="history">📊 <b>Historial</b><span>›</span></button><button data-page="summary">📋 <b>Resumen del día</b><span>›</span></button></div></section>`}
function grossToday(){return todaySales().reduce((sum,s)=>sum+s.items.reduce((x,i)=>x+(i.price-i.cost)*i.qty,0),0)}
function sell(){if(state.success)return success();let filtered=data.products.filter(p=>p.name.toLowerCase().includes(state.query.toLowerCase()));let cartTotal=state.cart.reduce((a,i)=>a+i.price*i.qty,0);return `<div class="title"><h2>Nueva venta</h2></div><input class="search" id="search" placeholder="🔎 Buscar producto..." value="${state.query}"><div class="products">${filtered.map(p=>`<button class="product" data-add="${p.id}"><div class="emoji">${iconFor(p)}</div><strong>${p.name}</strong><small>Stock: ${p.stock}</small><div class="price">${money(p.price)}</div></button>`).join('')}</div>${state.cart.length?`<div class="card" style="margin-top:14px"><b>Productos seleccionados</b>${state.cart.map(i=>`<div class="cartrow"><span>${i.name} x${i.qty}</span><b>${money(i.price*i.qty)}</b></div>`).join('')}<div class="total"><span>Total</span><span>${money(cartTotal)}</span></div><div class="paygrid">${['Efectivo','Tarjeta','SINPE'].map(p=>`<button class="pay ${state.payment===p?'selected':''}" data-pay="${p}">${p==='Efectivo'?'💵':p==='Tarjeta'?'💳':'📱'}<br>${p}</button>`).join('')}</div><button class="primary" data-checkout>Registrar venta</button></div>`:''}`}
function products(){return `<div class="title"><h2>Productos</h2><button class="plus" data-page="add">+</button></div><input class="search" id="productSearch" placeholder="🔎 Buscar producto..." value="${state.query}"><div class="list">${data.products.filter(p=>p.name.toLowerCase().includes(state.query.toLowerCase())).map(p=>`<div class="rowbtn"><span>${iconFor(p)} <b>${p.name}</b><br><small>${money(p.price)} · Stock: ${p.stock}</small></span><span>›</span></div>`).join('')}</div>`}
function addProduct(){return `<div class="title"><button class="back" data-page="products">‹</button><h2>Nuevo producto</h2><span></span></div><div class="card form"><label>Nombre<input id="pname" placeholder="Ej. Casado con pollo"></label><label>Precio de venta<input id="pprice" type="number" placeholder="2500"></label><label>Costo<input id="pcost" type="number" placeholder="1400"></label><label>Cantidad en stock<input id="pstock" type="number" placeholder="20"></label><button class="primary" data-save-product>Guardar producto</button></div>`}
function history(){let ss=[...data.sales].reverse();return `<div class="title"><h2>Historial</h2></div><div class="hero"><small>TOTAL REGISTRADO</small><div class="amount">${money(ss.reduce((a,s)=>a+s.total,0))}</div><b>${ss.length} ventas</b></div><div class="list">${ss.length?ss.map(s=>`<div class="sale"><div class="saleTop"><span>${new Date(s.date).toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'})} · ${s.items.map(i=>i.name+' x'+i.qty).join(', ')}</span><span>${money(s.total)}</span></div><small>${s.payment}</small></div>`).join(''):`<div class="empty">Todavía no hay ventas registradas.</div>`}</div>`}
function summary(){let ts=todaySales(), total=totalToday(), cost=ts.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.cost*i.qty,0),0);return `<div class="title"><h2>Resumen del día</h2></div><div class="card list"><div class="stat"><div class="ico">💰</div><div><strong>${money(total)}</strong><small>Ventas</small></div></div><div class="stat"><div class="ico">💵</div><div><strong>${money(sumPay(ts,'Efectivo'))}</strong><small>Efectivo</small></div></div><div class="stat"><div class="ico">💳</div><div><strong>${money(sumPay(ts,'Tarjeta'))}</strong><small>Tarjeta</small></div></div><div class="stat"><div class="ico">📱</div><div><strong>${money(sumPay(ts,'SINPE'))}</strong><small>SINPE</small></div></div><div class="stat"><div class="ico">🧾</div><div><strong>${ts.length}</strong><small>Ventas realizadas</small></div></div></div><div class="card" style="margin-top:12px"><small>Costo de productos</small><h2>${money(cost)}</h2><small>Ganancia estimada</small><h2 style="color:var(--green)">${money(total-cost)}</h2></div>`}
function sumPay(ss,p){return ss.filter(s=>s.payment===p).reduce((a,s)=>a+s.total,0)}
function success(){let s=state.success;return `<div class="success"><div class="check">✓</div><h2>¡Venta registrada!</h2><div class="big">${money(s.total)}</div><p>💵 ${s.payment}</p><button class="primary" data-page="sell">🛒 Nueva venta</button><button class="secondary" data-page="home">Volver al inicio</button></div>`}
function nav(){return `<nav class="nav">${[['home','⌂','Inicio'],['sell','🛒','Ventas'],['products','▣','Productos'],['history','☰','Historial']].map(([p,i,t])=>`<button class="${state.page===p?'active':''}" data-page="${p}"><span>${i}</span>${t}</button>`).join('')}</nav>`}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.query='';state.success=null;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(+b.dataset.add));document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{state.payment=b.dataset.pay;render()});let s=document.getElementById('search');if(s)s.oninput=e=>{state.query=e.target.value;render()};let ps=document.getElementById('productSearch');if(ps)ps.oninput=e=>{state.query=e.target.value;render()};let checkout=document.querySelector('[data-checkout]');if(checkout)checkout.onclick=checkoutSale;let savep=document.querySelector('[data-save-product]');if(savep)savep.onclick=saveProduct}
function addToCart(id){let p=data.products.find(x=>x.id===id);if(!p||p.stock<=0)return alert('Este producto no tiene existencias.');let item=state.cart.find(x=>x.id===id);if(item){if(item.qty>=p.stock)return alert('No hay más stock disponible.');item.qty++}else state.cart.push({...p,qty:1});render()}
function checkoutSale(){if(!state.cart.length)return;let total=state.cart.reduce((a,i)=>a+i.price*i.qty,0);data.sales.push({id:Date.now(),date:new Date().toISOString(),total,payment:state.payment,items:state.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost}))});state.cart.forEach(i=>{let p=data.products.find(x=>x.id===i.id);p.stock-=i.qty});save();state.success={total,payment:state.payment};state.cart=[];render()}
function saveProduct(){let name=document.getElementById('pname').value.trim(),price=+document.getElementById('pprice').value,cost=+document.getElementById('pcost').value,stock=+document.getElementById('pstock').value;if(!name||!price||cost<0||stock<0)return alert('Completá los datos del producto.');data.products.push({id:Date.now(),name,price,cost,stock,emoji:'📦'});save();state.page='products';state.query='';render()}
render();
</script>
</body></html>
